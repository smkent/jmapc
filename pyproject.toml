[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "jmapc"
dynamic = ["version"]
description = "A JMAP client library for Python"
readme = "README.md"
license = "GPL-3.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Stephen Kent", email = "smkent@smkent.net" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Email :: Post-Office",
    "Topic :: Documentation",
    "Topic :: Office/Business :: Groupware",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development",
    "Topic :: Utilities",
    "Typing :: Typed",
]
keywords = []
dependencies = [
    "brotli>=1.0.9",
    "dataclasses-json",
    "python-dateutil",
    "requests",
    "sseclient",
]

[project.urls]
Homepage = "https://smkent.github.io/jmapc"
Repository = "https://github.com/smkent/jmapc"
Issues = "https://github.com/smkent/jmapc/issues"

[dependency-groups]
dev = [
    "bump-my-version>=1.3.0",
    "pysentry-rs>=0.4",
    "pytest>=9",
    "pytest-cov>=7",
    "pytest-sugar>=1",
    "pytest-xdist>=3",
    "responses",
    "ruff>=0.15",
    "syrupy>=5",
    "ty>=0.0.49",
]
docs = [
    "mkdocstrings[python]>=1",
    "zensical>=0.0.45",
]

[tool.bumpversion]
commit = false
tag = true
tag_name = "v{new_version}"
tag_message = ""
push = true

[tool.hatch.build.targets.sdist]
include = ["/jmapc", "/tests", "/examples", "*.md", "LICENSE"]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.pytest]
addopts = [
    "-ra",
    "--cov=jmapc",
    "--strict-config",
    "--strict-markers",
    "--numprocesses",
    "auto",
]
testpaths = ["tests"]

[tool.coverage.run]
source = ["jmapc"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.ruff]
line-length = 79
output-format = "concise"
target-version = "py310"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed
    "COM812",  # Trailing comma missing
    "CPY001",  # Missing copyright notice at top of file
    "D1",  # Missing docstring presence rules
    "EM",  # flake8-errmsg
    "G004",  # Logging statement uses f-string
    "N818",  # error-suffix-on-exception-name
    "PLR",  # pylint Refactor
    "S101",  # Use of assert detected
    "S607",  # Starting a process with a partial executable path
    "T201",  # print
    "TC001",  # Move application import into a type-checking block
    "TC003",  # Move standard library import into a type-checking block
    "TD",  # flake8-todos
    "TRY003", # Avoid specifying long messages outside the exception class
]

[tool.ruff.lint.isort]
known-first-party = ["jmapc"]

[tool.ruff.lint.per-file-ignores]
"examples/**/*.py" = [
    "ERA001",  # Found commented-out code
    "TRY002",  # Create your own exception
]
"tests/**/*.py" = [
    "ARG",  # flake8-unused-arguments
    "S101",  # Use of assert detected
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.src]
include = ["jmapc/", "tests/"]

[tool.ty.terminal]
error-on-warning = true
output-format = "concise"

[tool.uv]
default-groups = ["dev", "docs"]

[tool.uv-dynamic-versioning]
pattern = "default-unprefixed"
fallback-version = "0.0.0"
