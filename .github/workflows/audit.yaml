name: Audit

on:
  push:
    branches:
      - main
    paths:
      - uv.lock
  pull_request:
    paths:
      - uv.lock

jobs:
  audit:
    name: Dependencies
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: '3.14'
    steps:
      - name: 💾 Check out repository
        uses: actions/checkout@v6

      - name: 📦 Restore uv cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: 🍳 Set up mise
        uses: jdx/mise-action@v4
        with:
          cache: true
          install: true

      - name: 🔍 Check dependencies
        run: mise run audit
